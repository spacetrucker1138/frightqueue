name: Refresh game data
on:
  schedule: [{ cron: "17 9 * * *" }]   # nightly, ~5:17 AM ET
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: refresh, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Refresh data
        run: python3 scripts/refresh_games.py --per-source 12
      - name: Build site
        run: python3 scripts/build.py
      - name: Commit if data changed
        run: |
          # games.json always gets a new "updated" stamp; only commit if the game list itself changed
          if git diff --quiet HEAD -- data/games.json || \
             [ "$(git show HEAD:data/games.json | jq -S .games)" = "$(jq -S .games data/games.json)" ]; then
            echo "No game data changes"; exit 0
          fi
          git config user.name "fright-queue-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data games index.html sitemap.xml
          git commit -m "Refresh game data $(date -u +%F)"
          git push
